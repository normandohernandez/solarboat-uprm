services:
  - type: web
    name: solarboat-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    disk:
      name: solarboat-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SOLARBOAT_DB
        value: /data/solarboat.db
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_TO
        value: solarboat@uprm.edu
      - key: NOTIFY_FROM
        sync: false
