# Publica web/frontend/ en GitHub Pages.
#
# Hace falta este workflow porque "deploy from a branch" solo sabe servir
# desde la raíz del repo o desde /docs, y el sitio vive en web/frontend/.
#
# Para activarlo: en GitHub → Settings → Pages → Source: "GitHub Actions".
name: Deploy sitio a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/frontend
      - id: deployment
        uses: actions/deploy-pages@v4
