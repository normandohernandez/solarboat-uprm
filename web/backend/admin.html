<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Boat UPRM — Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --green-dark: #0f4d22;
      --green-mid: #1a7c35;
      --green-pale: #e8f5ec;
      --border: #e0e8e2;
      --text-dark: #0f1a12;
      --text-mid: #444d47;
      --text-muted: #8a9490;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f8f5;
      color: var(--text-dark);
      padding: 32px 20px 80px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    h1 span { color: var(--green-mid); }
    .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }

    .login {
      display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .login input {
      flex: 1; min-width: 220px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .login input:focus { border-color: var(--green-mid); }
    button {
      background: var(--green-mid); color: #fff;
      border: none; border-radius: 8px;
      padding: 11px 22px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--green-dark); }
    button.ghost {
      background: #fff; color: var(--green-mid);
      border: 1px solid var(--border);
      font-size: 12px; padding: 7px 14px;
    }

    .error { color: #c0392b; font-size: 13px; margin-bottom: 16px; display: none; }

    section { margin-bottom: 36px; display: none; }
    .sec-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; gap: 10px; flex-wrap: wrap;
    }
    .sec-head h2 { font-size: 15px; }
    .count {
      background: var(--green-pale); color: var(--green-mid);
      font-size: 11px; font-weight: 700;
      border-radius: 20px; padding: 3px 10px; margin-left: 8px;
    }
    table {
      width: 100%; border-collapse: collapse;
      background: #fff; border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
      font-size: 13px;
    }
    th, td {
      text-align: left; padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      background: var(--green-pale); color: var(--green-dark);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    tr:last-child td { border-bottom: none; }
    td.msg { max-width: 380px; white-space: pre-wrap; word-break: break-word; }
    .empty { color: var(--text-muted); font-size: 13px; padding: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Solar<span>Boat</span> UPRM — Administration Panel</h1>
    <p class="sub">Contact messages, recruitment applications, and event subscribers.</p>

    <div class="login" id="loginRow">
      <input type="password" id="token" placeholder="Admin token"
             onkeydown="if(event.key==='Enter')load()" autocomplete="current-password" />
      <button onclick="load()">Sign In</button>
    </div>
    <p class="error" id="error"></p>

    <section id="sec-contacts">
      <div class="sec-head">
        <h2>📬 Contact Messages<span class="count" id="n-contacts"></span></h2>
        <button class="ghost" onclick="csv('contacts')">Download CSV</button>
      </div>
      <div id="t-contacts"></div>
    </section>

    <section id="sec-recruits">
      <div class="sec-head">
        <h2>🚀 Recruitment<span class="count" id="n-recruits"></span></h2>
        <button class="ghost" onclick="csv('recruits')">Download CSV</button>
      </div>
      <div id="t-recruits"></div>
    </section>

    <section id="sec-subscribers">
      <div class="sec-head">
        <h2>🔔 Notification Subscribers<span class="count" id="n-subscribers"></span></h2>
        <button class="ghost" onclick="csv('subscribers')">Download CSV</button>
      </div>
      <div id="t-subscribers"></div>
    </section>
  </div>

  <script>
    // Data lives only in this page's memory; the token is re-checked by the
    // server on every request and is never persisted to storage.
    let DATA = null;

    const COLS = {
      contacts:    ['created', 'nombre', 'email', 'asunto', 'mensaje'],
      recruits:    ['created', 'email'],
      subscribers: ['created', 'nombre', 'email', 'intereses'],
    };
    const LABELS = {
      created: 'Date', nombre: 'Name', email: 'Email', asunto: 'Subject',
      mensaje: 'Message', intereses: 'Interests',
    };

    async function load() {
      const token = document.getElementById('token').value.trim();
      const err = document.getElementById('error');
      err.style.display = 'none';
      if (!token) return;

      try {
        const res = await fetch('/api/admin/submissions', {
          headers: { 'X-Admin-Token': token },
        });
        const body = await res.json();
        if (!res.ok || !body.ok) throw new Error(body.error || 'Error');
        DATA = body;
        render();
      } catch (e) {
        err.textContent = e.message === 'Unauthorized.'
          ? 'Incorrect token.'
          : 'Error: ' + e.message;
        err.style.display = 'block';
      }
    }

    function esc(v) {
      const d = document.createElement('div');
      d.textContent = v == null ? '' : String(v);
      return d.innerHTML;
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleString('en-US', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
    }

    function render() {
      for (const key of Object.keys(COLS)) {
        const rows = DATA[key] || [];
        document.getElementById('sec-' + key).style.display = 'block';
        document.getElementById('n-' + key).textContent = rows.length;
        const host = document.getElementById('t-' + key);

        if (rows.length === 0) {
          host.innerHTML = '<div class="empty">Nothing yet.</div>';
          continue;
        }

        const cols = COLS[key];
        let html = '<table><tr>' +
          cols.map(c => '<th>' + esc(LABELS[c] || c) + '</th>').join('') + '</tr>';
        for (const row of rows) {
          html += '<tr>' + cols.map(c => {
            const val = c === 'created' ? fmtDate(row[c]) : row[c];
            const cls = c === 'mensaje' ? ' class="msg"' : '';
            return '<td' + cls + '>' + esc(val) + '</td>';
          }).join('') + '</tr>';
        }
        host.innerHTML = html + '</table>';
      }
    }

    function csv(key) {
      if (!DATA) return;
      const cols = COLS[key];
      const quote = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const lines = [cols.join(',')];
      for (const row of DATA[key] || []) {
        lines.push(cols.map(c => quote(row[c])).join(','));
      }
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'solarboat-' + key + '.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>
