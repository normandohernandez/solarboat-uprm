<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos — UPRM Solar Boat Team</title>
  <meta name="description" content="UPRM Solar Boat Team photo gallery featuring competitions, construction, and the team." />

  <!-- ================================================
       TIPOGRAFÍA — cámbiala aquí
  ================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ================================================
       ESTILOS
       El orden importa: primero las variables, luego lo
       base y compartido, después cada sección, y al final
       los @media, que tienen que poder pisar lo anterior.
  ================================================ -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/utilities.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/animations.css" />

  <link rel="stylesheet" href="css/sections/hero.css" />
  <link rel="stylesheet" href="css/sections/stats.css" />
  <link rel="stylesheet" href="css/sections/about.css" />
  <link rel="stylesheet" href="css/sections/achievements.css" />
  <link rel="stylesheet" href="css/sections/news.css" />
  <link rel="stylesheet" href="css/sections/team.css" />
  <link rel="stylesheet" href="css/sections/events.css" />
  <link rel="stylesheet" href="css/sections/donations.css" />
  <link rel="stylesheet" href="css/sections/recruitment.css" />
  <link rel="stylesheet" href="css/sections/gallery.css" />
  <link rel="stylesheet" href="css/sections/social.css" />
  <link rel="stylesheet" href="css/sections/contact.css" />
  <link rel="stylesheet" href="css/sections/home.css" />

  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/redesign.css" />
</head>
<body>

  <!-- Menú de navegación: se genera desde js/layout.js (edítalo allí) -->
  <script src="js/layout.js" data-part="header"></script>

  <main>

  <!-- ================================================
       GALLERY / IMAGES
  ================================================ -->
  <section class="gallery" id="fotos" aria-label="Photo gallery">
    <div class="container gallery-shell">
      <div class="gallery-header reveal">
        <div class="gallery-heading-group">
          <span class="gallery-kicker">Competition archive</span>
          <h1 class="section-heading">MONACO GALLERY 2024</h1>
          <p class="section-lead">Moments from the Monaco Energy Boat Challenge.</p>
        </div>
        <div class="gallery-filter" aria-label="Filter gallery">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="competencia">Competition</button>
          <button class="filter-btn" data-filter="equipo">Team</button>
          <button class="filter-btn" data-filter="barco">Boat</button>
        </div>
      </div>
      <div class="gallery-grid">
        <button class="gallery-item reveal" type="button" data-cat="barco" data-title="Solar Boat in Monaco" data-description="Solar Boat UPRM at the Monaco Energy Boat Challenge." data-src="fotos/barco-solar-monaco-puerto.jpg">
          <img src="fotos/barco-solar-monaco-puerto.jpg" alt="Solar Boat UPRM displayed at the Monaco marina" loading="eager">
          <span class="gallery-caption"><strong>Solar Boat in Monaco</strong><small>Monaco Energy Boat Challenge</small></span>
        </button>
        <button class="gallery-item reveal" type="button" data-cat="equipo" data-title="Official Team Photo" data-description="Solar Boat UPRM representing Puerto Rico in Monaco." data-src="fotos/equipo-oficial-monaco.jpg">
          <img src="fotos/equipo-oficial-monaco.jpg" alt="Solar Boat UPRM team holding Puerto Rico flags at the Monaco Energy Boat Challenge" loading="lazy">
          <span class="gallery-caption"><strong>Official Team Photo</strong><small>Representing Puerto Rico</small></span>
        </button>
        <button class="gallery-item reveal" type="button" data-cat="equipo" data-title="Team and Solar Boat" data-description="The team with its solar-powered boat at the competition marina." data-src="fotos/equipo-con-barco-monaco.jpg">
          <img src="fotos/equipo-con-barco-monaco.jpg" alt="Solar Boat UPRM team standing with its boat at the marina" loading="lazy">
          <span class="gallery-caption"><strong>Team and Solar Boat</strong><small>Competition marina</small></span>
        </button>
        <button class="gallery-item reveal" type="button" data-cat="barco" data-title="Solar Boat Profile" data-description="A side view of the Solar Boat UPRM competition vessel." data-src="fotos/barco-solar-vista-lateral-monaco.jpg">
          <img src="fotos/barco-solar-vista-lateral-monaco.jpg" alt="Side view of the Solar Boat UPRM vessel in Monaco" loading="lazy">
          <span class="gallery-caption"><strong>Solar Boat Profile</strong><small>Competition vessel</small></span>
        </button>
        <button class="gallery-item reveal" type="button" data-cat="equipo" data-title="Puerto Rico in Monaco" data-description="The Solar Boat UPRM team celebrating with the Puerto Rico flag." data-src="fotos/equipo-bandera-puerto-rico-monaco.jpg">
          <img src="fotos/equipo-bandera-puerto-rico-monaco.jpg" alt="Solar Boat UPRM team celebrating with a Puerto Rico flag" loading="lazy">
          <span class="gallery-caption"><strong>Puerto Rico in Monaco</strong><small>Team celebration</small></span>
        </button>
        <button class="gallery-item reveal" type="button" data-cat="competencia" data-title="At the Marina" data-description="The team preparing for competition activities at the Monaco marina." data-src="fotos/equipo-en-muelle-monaco.jpg">
          <img src="fotos/equipo-en-muelle-monaco.jpg" alt="Solar Boat UPRM team at the Monaco marina" loading="lazy">
          <span class="gallery-caption"><strong>At the Marina</strong><small>Competition day</small></span>
        </button>
        <button class="gallery-item reveal" type="button" data-cat="competencia" data-title="International Competitors" data-description="Participants gathered at the Monaco Energy Boat Challenge." data-src="fotos/participantes-internacionales-monaco.jpg">
          <img src="fotos/participantes-internacionales-monaco.jpg" alt="International participants at the Monaco Energy Boat Challenge" loading="lazy">
          <span class="gallery-caption"><strong>International Competitors</strong><small>Monaco Energy Boat Challenge</small></span>
        </button>
        <button class="gallery-item reveal" type="button" data-cat="equipo" data-title="Monaco Team Event" data-description="Solar Boat UPRM together during an evening event in Monaco." data-src="fotos/equipo-evento-nocturno-monaco.jpg">
          <img src="fotos/equipo-evento-nocturno-monaco.jpg" alt="Solar Boat UPRM team together at an evening event in Monaco" loading="lazy">
          <span class="gallery-caption"><strong>Monaco Team Event</strong><small>Team experience</small></span>
        </button>
      </div>

      <div class="gallery-more reveal">
        <p>
          Follow the team for more competition photos and project updates.
        </p>
        <a href="https://www.instagram.com/uprm_solar_boat/" target="_blank" rel="noopener" class="btn btn-primary">See More on Instagram →</a>
      </div>
    </div>

    <!-- Lightbox overlay -->
    <div class="gallery-overlay" id="galleryOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Expanded gallery photo" onclick="closeGallery(event)">
      <div class="gallery-overlay-inner">
        <div class="gallery-overlay-img" id="galleryOverlayImg">
          <!-- image renders here -->
        </div>
      </div>
      <button class="gallery-overlay-close" type="button" onclick="closeGallery(event)" aria-label="Close photo viewer"></button>
    </div>
  </section>

  </main>

  <!-- Pie de página: se genera desde js/layout.js (edítalo allí) -->
  <script src="js/layout.js" data-part="footer"></script>

  <!-- ================================================
       SCRIPTS
       Son <script> normales (no módulos) a propósito: así la
       página también funciona abriéndola con doble clic, y las
       funciones que llaman los onclick del HTML siguen siendo
       accesibles. api.js va primero porque los demás lo usan.
  ================================================ -->
  <script src="js/nav.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/gallery.js"></script>

</body>
</html>
