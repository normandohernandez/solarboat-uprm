<body>

  <!-- Menú de navegación: se genera desde js/layout.js (edítalo allí) -->
  <script src="js/layout.js" data-part="header"></script>

  <main>

  <!-- ================================================
       CONTACT
  ================================================ -->
  <section class="contact" id="contacto" aria-label="Contact">
    <div class="container">
      <h1 class="section-heading reveal">Want to <em>learn more</em>?</h1>
      <p class="reveal">Contact us about collaborations, sponsorships, media inquiries, or simply to learn more about the team.</p>
      <form class="contact-form reveal" id="contactForm" novalidate>
        <div class="contact-row">
          <input type="text"  name="nombre"  placeholder="Your name"  required autocomplete="name" />
          <input type="email" name="email"   placeholder="Your email"  required autocomplete="email" />
        </div>
        <input type="text" name="asunto" placeholder="Subject" />
        <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <textarea name="mensaje" placeholder="Your message..." required></textarea>
        <!-- ── Wire up your backend/EmailJS/Formspree here ── -->
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>

      <!-- ── Redes sociales — añade LinkedIn aquí cuando exista la cuenta ── -->
      <div class="contact-social reveal">
        <a href="https://www.instagram.com/uprm_solar_boat/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e1a3c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.5" fill="#e1a3c9"/>
          </svg>
          Instagram
        </a>
        <a href="https://www.facebook.com/UPRMSolarBoat/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="#7eb3ff" aria-hidden="true">
            <path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>
          </svg>
          Facebook
        </a>
        <!-- <a href="https://www.linkedin.com/company/TU-PAGINA" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="#7eb3ff" aria-hidden="true">
            <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
          </svg>
          LinkedIn
        </a> -->
      </div>
    </div>
  </section>

  </main>
